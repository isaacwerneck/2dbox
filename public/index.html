<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2DBox | Login</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-card">
        <h1>2DBox</h1>
        <p class="subtitle">Enter your house-network world</p>

        <div class="tabs">
          <button id="tab-login" class="tab active" type="button">Login</button>
          <button id="tab-register" class="tab" type="button">Create account</button>
        </div>

        <form id="auth-form" class="auth-form">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" autocomplete="username" required />

          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />

          <button id="submit-btn" type="submit">Login</button>
        </form>

        <p id="message" class="message" aria-live="polite"></p>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
